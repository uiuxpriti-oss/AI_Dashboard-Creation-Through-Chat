<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Me – Top Gradient</title>
<style>
  body { margin: 0; background: #FFFFFF; }
  .am-top-gradient {
    position: relative;
    width: 100%;
    height: 358px;
    overflow: hidden;
    background: linear-gradient(180deg, #F1F5F9 0%, #FFFFFF 100%);
  }
  .am-top-gradient::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(#CBD5E1 0.6px, transparent 0.6px);
    background-size: 6px 6px;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    opacity: 0.7;
    pointer-events: none;
  }
  .am-top-gradient .dots-white {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(#FFFFFF 0.9px, transparent 0.9px);
    background-size: 6px 6px;
    -webkit-mask-image: radial-gradient(ellipse 380px 230px at 50% 0%, #000 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
    mask-image: radial-gradient(ellipse 380px 230px at 50% 0%, #000 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }
  .am-top-gradient::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -100px;
    width: 428px;
    height: 230px;
    margin-left: -214px;
    border-radius: 100px;
    background: linear-gradient(89.136deg, #22D3EE 0.41%, #3B82F6 50%, #E879F9 99.59%);
    opacity: 0.2;
    filter: blur(60px);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="am-top-gradient"><div class="dots-white"></div></div>
</body>
</html>
