<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Me – Top Gradient with Dots</title>
<style>
  body { margin: 0; background: #FFFFFF; }

  /* Scales with width: 358px at 1440, grows on larger screens */
  .am-top-bg {
    --h: clamp(280px, 24.8vw, 520px);
    position: relative;
    width: 100%;
    height: var(--h);
    overflow: hidden;
    background: linear-gradient(180deg, #F1F5F9 0%, #FFFFFF 100%);
  }

  /* 1. Colored glow — ~30% of width, centered */
  .am-top-bg__glow {
    position: absolute;
    left: 35%;
    top: calc(var(--h) * -0.28);
    width: 30%;
    height: calc(var(--h) * 0.64);
    border-radius: 999px;
    background: linear-gradient(89.136deg, #22D3EE 0.41%, #3B82F6 50%, #E879F9 99.59%);
    opacity: 0.2;
    filter: blur(clamp(48px, 4.2vw, 90px));
  }

  /* 2. Gray dots — 1px radius so they render on 1x (non-retina) screens */
  .am-top-bg__dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #CBD5E1 1px, transparent 1.2px);
    background-size: 6px 6px;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    opacity: 0.55;
  }

  /* 3. White dots — only over the glow, sized relative to width */
  .am-top-bg__dots-white {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #FFFFFF 1px, transparent 1.2px);
    background-size: 6px 6px;
    -webkit-mask-image: radial-gradient(ellipse 39% 100% at 50% 0%, #000 0%, rgba(0,0,0,0.85) 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 39% 100% at 50% 0%, #000 0%, rgba(0,0,0,0.85) 55%, transparent 100%);
    opacity: 0.5;
  }

  .am-top-bg > * { pointer-events: none; }
</style>
</head>
<body>
  <div class="am-top-bg">
    <div class="am-top-bg__glow"></div>
    <div class="am-top-bg__dots"></div>
    <div class="am-top-bg__dots-white"></div>
  </div>
</body>
</html>
